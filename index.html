<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện tập định dạng trang web</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Tiêu đề chính -->
    <h1 id="main-heading">Trang web của tôi</h1>

    <!-- Đoạn văn mô tả bản thân -->
    <p class="description">Xin chào! Tôi là Ngọc Anh, một lập trình viên đang trên con đường chinh phục công nghệ web.</p>

    <!-- Danh sách sở thích -->
    <div class="hobbies-container">
        <h3>Sở thích cá nhân</h3>
        <ul>
            <li class="hobby-item">Đọc sách lập trình</li>
            <li class="hobby-item">Nghe nhạc nhẹ</li>
            <li class="hobby-item">Chơi thể thao</li>
        </ul>
    </div>

    <!-- Nút bấm tương tác -->
    <div class="btn-container">
        <button class="action-btn">Nhấn vào đây</button>
    </div>

</body>
</html>
